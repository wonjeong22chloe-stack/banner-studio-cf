<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>소재 갤러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEEDF1; --panel:#FFFFFF; --line:#DDDAE4; --fg:#1C1A22; --muted:#6C6878;
  --accent:#0D6E8A; --accent-fg:#FFFFFF; --accent-soft:#DCEEF3; --stage:#E3E1E8;
  --heart:#E0245E; --heart-soft:#FCE4EC;
  --ui:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141318; --panel:#1D1C22; --line:#302E37; --fg:#ECEAF1; --muted:#9B97A6;
  --accent:#4FB3CF; --accent-fg:#0B1A20; --accent-soft:#1B3740; --stage:#18171C;
  --heart:#FF5C8A; --heart-soft:#3A1B26; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--ui);font-size:13px;line-height:1.45;padding:18px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
header p{margin:3px 0 0;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:12px}
.btn:focus-visible,.card:focus-visible,.heart:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px;position:sticky;top:8px;z-index:5}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px}
.tab{border:0;background:transparent;border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab .n{font-weight:500;margin-left:4px;font-size:12px}
.tab.fav[aria-pressed="true"]{color:var(--heart)}
.bar input[type=search],.bar select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px}
.bar input[type=search]{flex:1;min-width:180px}
.spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;transition:border-color .12s}
.card:hover{border-color:var(--muted)}
.card.isfav{border-color:var(--heart)}
.thumb{background:var(--stage);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.heart:hover{color:var(--heart)}
.heart[aria-pressed="true"]{color:#fff;background:var(--heart);border-color:var(--heart)}
.info{padding:10px 11px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title.none{color:var(--muted);font-weight:500}
.meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo{font-size:12px;background:var(--heart-soft);border-radius:6px;padding:4px 7px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:4px;color:var(--muted);font-weight:500}
.empty{text-align:center;color:var(--muted);padding:60px 16px;background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.status{color:var(--muted);font-size:12px}
/* detail */
.modal{position:fixed;inset:0;background:rgba(10,10,14,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.box{background:var(--panel);border-radius:14px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:0}
.view{background:var(--stage);display:flex;align-items:center;justify-content:center;padding:16px;min-height:320px}
.view img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;display:block;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.side{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.side h2{font-size:17px;margin:0;word-break:keep-all}
.side .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side label{font-weight:600;font-size:12px}
.side textarea{width:100%;min-height:74px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px;resize:vertical}
.side input[type=text]{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px}
.vers{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.vers button{flex:0 0 auto;width:64px;border:2px solid transparent;border-radius:8px;padding:0;background:var(--stage);cursor:pointer;overflow:hidden}
.vers button[aria-pressed="true"]{border-color:var(--accent)}
.vers img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block}
.dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.bigheart{font-size:14px;font-weight:600}
.bigheart[aria-pressed="true"]{background:var(--heart);border-color:var(--heart);color:#fff}
.close{margin-left:auto}
.btn.danger{color:var(--heart);border-color:var(--heart)}
.btn.danger:hover{background:var(--heart);color:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.up{width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.up h2{font-size:17px;margin:0}
.up .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.up input[type=text],.up input[type=date]{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px}
.uplist{display:flex;flex-direction:column;gap:8px}
.upitem{display:grid;grid-template-columns:72px minmax(0,1fr) 150px auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}
.upitem img{width:72px;height:72px;object-fit:contain;background:var(--stage);border-radius:6px}
.upitem input[type=text]{width:100%;font-weight:600}
.upitem .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.upitem .hb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);font-size:16px}
.upitem .hb[aria-pressed="true"]{background:var(--heart);border-color:var(--heart);color:#fff}
.upitem .st{font-size:12px;color:var(--muted);min-width:44px;text-align:right}
.upitem .st.ok{color:var(--accent);font-weight:600} .upitem .st.err{color:var(--heart)}
.drophint{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drophint:hover,.drophint.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
body.dragging::after{content:"여기에 놓으면 소재로 올라가요";position:fixed;inset:10px;border:3px dashed var(--accent);border-radius:16px;background:rgba(13,110,138,.08);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent);z-index:40;pointer-events:none}
@media (max-width:720px){ .upitem{grid-template-columns:56px minmax(0,1fr) auto} .upitem img{width:56px;height:56px} .upitem input[type=date]{grid-column:2} }
@media (max-width:720px){ .box{grid-template-columns:1fr} .view{min-height:220px} .bar{position:static} }
@media (prefers-reduced-motion:reduce){.toast,.card{transition:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>소재 갤러리</h1>
    <p>팀이 배너 스튜디오에서 저장한 소재와 직접 올린 기존 소재가 모두 모여요. 성과가 좋았던 소재엔 ♥를 눌러 따로 모아보세요.</p>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="status" id="status"></span>
    <a class="btn" href="/" target="_blank" rel="noopener">배너 스튜디오 열기 ↗</a>
    <button class="btn primary" type="button" id="upBtn">＋ 기존 소재 올리기</button>
    <input type="file" id="upFile" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml,.svg" multiple hidden>
  </div>
</header>

<div class="bar" role="search">
  <div class="tabs" id="tabs">
    <button class="tab" type="button" data-v="all" aria-pressed="true">전체<span class="n" id="nAll"></span></button>
    <button class="tab fav" type="button" data-v="fav" aria-pressed="false">♥ 성과 좋은 소재<span class="n" id="nFav"></span></button>
  </div>
  <input type="search" id="q" placeholder="소재명·문구로 찾기" aria-label="소재 검색">
  <select id="who" aria-label="만든 사람"><option value="">모든 사람</option></select>
  <select id="size" aria-label="사이즈"><option value="">모든 사이즈</option></select>
  <select id="sort" aria-label="정렬"><option value="new">최근 저장순</option><option value="old">오래된 순</option><option value="name">이름순</option><option value="many">많이 저장한 순</option></select>
  <span class="spacer"></span>
  <button class="btn small" type="button" id="showHidden" aria-pressed="false" hidden></button>
</div>

<div id="list"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TPL={tilt:'라방 · 기울어진 카드',alarm:'라방 · 알람시계',gift:'라방 · 1+1+증정품',grid:'블럭형',side:'좌 상품 + 우 할인율',calendar:'캘린더형',big:'할인율 소구',family:'패밀리세일',center:'센터 포커스',left:'좌측 카피',promo:'할인 띠배너',frame:'매거진 프레임',split:'대각 스플릿'};
const tplName=e=>e.tname||TPL[e.tid]||e.tid||'';
const TYPE={png:'PNG',jpg:'JPG',figma:'피그마',save:'작업함',upload:'직접 올림'};
const myName=()=>{ try{ return localStorage.getItem('banner-studio-author')||''; }catch(e){ return ''; } };
const fmt=t=>{ const d=new Date(t); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const day=t=>{ const d=new Date(t); return `${d.getMonth()+1}월 ${d.getDate()}일`; };
let tT=0; const toast=m=>{ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),2200); };

let groups=[], marks={}, view='all', showHidden=false, loaded=false;
const st={q:'',who:'',size:'',sort:'new'};
try{ const v=sessionStorage.getItem('gallery-view'); if(v) Object.assign(st,JSON.parse(v)); }catch(e){}

/* every saved banner is one event; events of the same creative (same 소재 id) become one card with versions */
function build(events){
  const map=new Map();
  events.forEach(e=>{ const key=e.cid||e.id; let g=map.get(key); if(!g){ g={key,events:[]}; map.set(key,g); } g.events.push(e); });
  return [...map.values()].map(g=>{ g.events.sort((a,b)=>b.time-a.time); const l=g.events[0];
    g.latest=l; g.title=(g.events.find(e=>e.title)||{}).title||''; g.time=l.time; g.first=g.events[g.events.length-1].time;
    g.authors=[...new Set(g.events.map(e=>e.name).filter(Boolean))]; g.sizes=[...new Set(g.events.map(e=>e.size).filter(Boolean))];
    // one version per distinct export moment: PNG+JPG of the same design a few seconds apart count once
    const vers=[]; g.events.forEach(e=>{ const p=vers[vers.length-1]; if(p && Math.abs(p.time-e.time)<90e3 && p.size===e.size){ p.types.push(e.type); return; } vers.push({...e,types:[e.type]}); });
    g.versions=vers; return g; });
}
async function load(quiet){
  try{
    const r=await fetch('/api/live?gallery=1',{cache:'no-store'}); if(!r.ok) throw new Error(r.status);
    const j=await r.json(); if(!j.ok) throw 0;
    marks=j.marks||{}; groups=build(j.events||[]); loaded=true;
    $('status').textContent=`${fmt(Date.now())} 기준`;
    fillSelects(); render();
  }catch(e){ if(!loaded) $('list').innerHTML=`<div class="empty">소재 목록을 불러오지 못했어요.<br>팀 사이트(Netlify)에서 열었는지 확인해주세요.</div>`; else if(!quiet) toast('새로고침하지 못했어요'); }
}
function fillSelects(){
  const who=[...new Set(groups.flatMap(g=>g.authors))].sort((a,b)=>a.localeCompare(b,'ko'));
  const sizes=[...new Set(groups.flatMap(g=>g.sizes))].sort();
  const set=(id,list,label)=>{ const el=$(id), cur=st[id]; el.innerHTML=`<option value="">${label}</option>`+list.map(v=>`<option value="${esc(v)}">${esc(id==='size'?v.replace('x','×'):v)}</option>`).join(''); el.value=list.includes(cur)?cur:''; st[id]=el.value; };
  set('who',who,'모든 사람'); set('size',sizes,'모든 사이즈');
  $('q').value=st.q; $('sort').value=st.sort;
}
const isFav=g=>!!(marks[g.key]&&marks[g.key].fav);
const isHidden=g=>!!(marks[g.key]&&marks[g.key].hidden);
function filtered(){
  const q=st.q.trim().toLowerCase();
  let list=groups.filter(g=>showHidden?isHidden(g):!isHidden(g));
  const nAll=list.length, nFav=list.filter(isFav).length;
  $('nAll').textContent=nAll; $('nFav').textContent=nFav;
  if(view==='fav') list=list.filter(isFav);
  if(st.who) list=list.filter(g=>g.authors.includes(st.who));
  if(st.size) list=list.filter(g=>g.sizes.includes(st.size));
  if(q) list=list.filter(g=>[g.title,g.latest.headline,(marks[g.key]||{}).memo,g.authors.join(' ')].join(' ').toLowerCase().includes(q));
  const by={new:(a,b)=>b.time-a.time, old:(a,b)=>a.first-b.first, name:(a,b)=>(a.title||'￿').localeCompare(b.title||'￿','ko'), many:(a,b)=>b.versions.length-a.versions.length||b.time-a.time};
  return list.sort(by[st.sort]||by.new);
}
function render(){
  try{ sessionStorage.setItem('gallery-view',JSON.stringify(st)); }catch(e){}
  const nh=groups.filter(isHidden).length, hb=$('showHidden');
  hb.hidden=!nh && !showHidden; hb.textContent=showHidden?'← 갤러리로 돌아가기':`숨긴 소재 ${nh}개`; hb.setAttribute('aria-pressed',showHidden);
  const list=filtered();
  if(!list.length){
    $('list').innerHTML=`<div class="empty">${view==='fav'&&!st.q&&!st.who&&!st.size?'아직 ♥ 표시한 소재가 없어요.<br>성과가 좋았던 소재 카드의 ♥를 눌러보세요.':groups.length?'조건에 맞는 소재가 없어요.':'아직 소재가 없어요.<br>오른쪽 위 ‘＋ 기존 소재 올리기’로 내 컴퓨터의 소재를 올리거나,<br>배너 스튜디오에서 PNG·JPG·피그마로 저장하면 여기에 모여요.'}</div>`;
    return;
  }
  $('list').innerHTML=`<div class="grid">${list.map(g=>{ const m=marks[g.key]||{}, l=g.latest, fav=isFav(g);
    return `<article class="card${fav?' isfav':''}" tabindex="0" data-key="${esc(g.key)}" aria-label="${esc(g.title||l.headline||'이름 없는 소재')}">
      <div class="thumb"><img loading="lazy" alt="" src="/api/live/${encodeURIComponent(l.id)}?thumb=1"></div>
      <button class="heart" type="button" data-heart="${esc(g.key)}" aria-pressed="${fav}" title="${fav?'성과 좋은 소재에서 빼기':'성과 좋은 소재로 표시'}" aria-label="하트">${fav?'♥':'♡'}</button>
      <div class="info">
        <div class="title${g.title?'':' none'}">${esc(g.title||l.headline||'이름 없는 소재')}</div>
        <div class="meta">${esc(g.authors.join(', ')||'이름 없음')} · ${l.type==='upload'?'직접 올린 소재':esc(tplName(l))} · ${esc((l.size||'').replace('x','×'))}</div>
        <div class="meta">${day(g.time)}${g.versions.length>1?`<span class="tag">저장 ${g.versions.length}번</span>`:''}</div>
        ${m.memo?`<div class="memo" title="${esc(m.memo)}">📈 ${esc(m.memo)}</div>`:''}
      </div></article>`; }).join('')}</div>`;
}
async function mark(key, patch){
  const prev=Object.assign({},marks[key]||{});
  marks[key]=Object.assign({},prev,patch); render();
  try{ const r=await fetch('/api/live?fav=1',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({key,name:myName()},patch))});
    if(!r.ok) throw 0; const j=await r.json(); marks[key]=j.mark||marks[key]; render(); return true;
  }catch(e){ marks[key]=prev; render(); toast('저장하지 못했어요. 잠시 뒤 다시 해주세요'); return false; }
}
function toggleFav(key){ const on=!(marks[key]&&marks[key].fav); mark(key,{fav:on}).then(ok=>{ if(ok) toast(on?'♥ 성과 좋은 소재로 표시했어요':'하트를 뺐어요'); }); return on; }

/* detail view */
let modal=null;
function closeDetail(){ if(modal){ modal.remove(); modal=null; document.removeEventListener('keydown',onKey); } }
function onKey(e){ if(e.key==='Escape') closeDetail(); }
function openDetail(key){
  const g=groups.find(x=>x.key===key); if(!g) return; closeDetail();
  let cur=g.versions[0];
  modal=document.createElement('div'); modal.className='modal';
  modal.addEventListener('click',e=>{ if(e.target===modal) closeDetail(); });
  document.body.appendChild(modal); document.addEventListener('keydown',onKey);
  const draw=()=>{ const m=marks[g.key]||{}, fav=!!m.fav;
    modal.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="소재 자세히 보기">
      <div class="view"><img alt="${esc(g.title||'소재')}" src="/api/live/${encodeURIComponent(cur.id)}?full=1"></div>
      <div class="side">
        <div class="row"><h2>${esc(g.title||cur.headline||'이름 없는 소재')}</h2><button class="btn small close" type="button" data-x>닫기</button></div>
        <div class="row"><button class="btn bigheart" type="button" data-fav aria-pressed="${fav}">${fav?'♥ 성과 좋은 소재':'♡ 성과 좋은 소재로 표시'}</button>${fav&&m.favBy?`<span class="status">${esc(m.favBy)} 님이 표시</span>`:''}</div>
        <div><label for="memo">성과 메모</label>
          <textarea id="memo" maxlength="300" placeholder="예) CTR 2.4% · 전환 1위 · 11/3 라방 메인">${esc(m.memo||'')}</textarea>
          <div class="row" style="justify-content:flex-end;margin-top:6px"><span class="status" id="memoSt"></span><button class="btn small" type="button" data-memo>메모 저장</button></div></div>
        <dl class="dl">
          <dt>만든 사람</dt><dd>${esc(cur.name||'이름 없음')}</dd>
          <dt>${cur.type==='upload'?'제작일':'저장'}</dt><dd>${cur.type==='upload'?fmt(cur.time).split(' ')[0]:fmt(cur.time)+' · '+cur.types.map(t=>TYPE[t]||t).join(', ')}</dd>
          <dt>${cur.type==='upload'?'크기':'템플릿'}</dt><dd>${cur.type==='upload'?'':esc(tplName(cur))+' · '}${esc((cur.size||'').replace('x','×'))}</dd>
          ${cur.headline?`<dt>헤드라인</dt><dd>${esc(cur.headline)}</dd>`:''}
        </dl>
        ${g.versions.length>1?`<div><label>저장한 버전 ${g.versions.length}개</label><div class="vers">${g.versions.map(v=>`<button type="button" data-v="${esc(v.id)}" aria-pressed="${v===cur}" title="${fmt(v.time)}"><img alt="" loading="lazy" src="/api/live/${encodeURIComponent(v.id)}?thumb=1"></button>`).join('')}</div></div>`:''}
        <div class="row">
          <button class="btn primary" type="button" data-edit title="${cur.type==='upload'?'완성 이미지를 배경으로 열고 그 위에 덧붙여 수정해요':'문구·상품·위치까지 그대로 열려요'}">이 소재로 편집하기 ↗</button>
          <button class="btn" type="button" data-dl>이미지 받기</button>
        </div>
        <div class="row" style="margin-top:auto"><button class="btn small" type="button" data-hide title="목록에서만 안 보이게 해요. 오른쪽 위 ‘숨긴 소재’에서 되살릴 수 있어요">${m.hidden?'갤러리에 다시 보이기':'갤러리에서 숨기기'}</button>
          <button class="btn small danger" type="button" data-del title="소재와 저장한 버전 ${g.versions.length}개를 완전히 지워요">삭제</button></div>
        <div class="row" id="delPw" hidden><input type="password" id="delPwIn" placeholder="팀 비밀번호" autocomplete="off" style="flex:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px"><button class="btn small danger" type="button" data-delgo>삭제</button></div>
      </div></div>`;
  };
  draw();
  modal.addEventListener('click',async e=>{
    const t=e.target.closest('button'); if(!t) return;
    if(t.hasAttribute('data-x')) return closeDetail();
    if(t.hasAttribute('data-fav')){ toggleFav(g.key); draw(); return; }
    if(t.dataset.v){ cur=g.versions.find(v=>v.id===t.dataset.v)||cur; draw(); return; }
    if(t.hasAttribute('data-memo')){ const memo=modal.querySelector('#memo').value.trim(); if(await mark(g.key,{memo})){ toast('성과 메모를 저장했어요'); draw(); } return; }
    if(t.hasAttribute('data-edit')){ window.open('/?open='+encodeURIComponent(cur.id),'_blank','noopener'); return; }
    if(t.hasAttribute('data-dl')){ download(g,cur); return; }
    if(t.hasAttribute('data-del')){
      if(!confirm(`‘${g.title||g.latest.headline||'이름 없는 소재'}’를 삭제할까요?\n저장한 버전 ${g.versions.length}개와 하트·메모가 모두 지워지고 되돌릴 수 없어요.`)) return;
      let pw=''; try{ pw=localStorage.getItem('banner-studio-teampw')||''; }catch(e){}
      return delGroup(g,pw); }
    if(t.hasAttribute('data-delgo')){ const pw=modal.querySelector('#delPwIn').value; try{ localStorage.setItem('banner-studio-teampw',pw); }catch(e){} return delGroup(g,pw); }
    if(t.hasAttribute('data-hide')){ const hide=!(marks[g.key]||{}).hidden;
      if(hide && !confirm('이 소재를 갤러리에서 숨길까요? 오른쪽 위 ‘숨긴 소재’에서 다시 보이게 할 수 있어요.')) return;
      if(await mark(g.key,{hidden:hide})){ closeDetail(); toast(hide?'갤러리에서 숨겼어요':'다시 보이게 했어요'); } }
  });
}
async function delGroup(g,pw){
  try{ const r=await fetch('/api/live/'+encodeURIComponent(g.key),{method:'DELETE',headers:pw?{'x-team-password':pw}:{}});
    if(r.status===401){ const row=modal&&modal.querySelector('#delPw'); if(row){ row.hidden=false; const i=row.querySelector('input'); i.value=''; i.focus(); } toast(pw?'팀 비밀번호가 맞지 않아요':'삭제하려면 팀 비밀번호가 필요해요'); return; }
    if(!r.ok) throw 0;
    closeDetail(); groups=groups.filter(x=>x!==g); delete marks[g.key]; render(); toast('소재를 삭제했어요'); load(true);
  }catch(e){ toast('삭제하지 못했어요. 잠시 뒤 다시 해주세요'); }
}
async function download(g,v){
  const name=`${(g.title||v.headline||'소재').replace(/[\\/:*?"<>|\n\r\t]+/g,' ').trim()}_${v.size||''}.jpg`;
  try{ const r=await fetch(`/api/live/${encodeURIComponent(v.id)}?full=1`); if(!r.ok) throw 0; const b=await r.blob();
    if(window.showSaveFilePicker){ try{ const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'JPG 이미지',accept:{'image/jpeg':['.jpg']}}]}); const w=await h.createWritable(); await w.write(b); await w.close(); toast('저장했어요'); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ toast('이미지를 받지 못했어요'); }
}

$('list').addEventListener('click',e=>{ const h=e.target.closest('[data-heart]'); if(h){ e.stopPropagation(); toggleFav(h.dataset.heart); return; }
  const c=e.target.closest('.card'); if(c) openDetail(c.dataset.key); });
$('list').addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){ e.preventDefault(); openDetail(e.target.dataset.key); } });
$('tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b) return; view=b.dataset.v; document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b)); render(); });
let qT=0; $('q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{ st.q=e.target.value; render(); },150); });
['who','size','sort'].forEach(id=>$(id).addEventListener('change',e=>{ st[id]=e.target.value; render(); }));
$('showHidden').onclick=()=>{ showHidden=!showHidden; render(); };
if(location.hash==='#fav'){ view='fav'; document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v==='fav')); }
/* ---------- 기존 소재 올리기 ---------- */
const MAX_FULL=2*1024*1024;
const browserId=()=>{ try{ let b=localStorage.getItem('banner-studio-bid'); if(!b){ b=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); localStorage.setItem('banner-studio-bid',b); } return b; }catch(e){ return 'g'+Math.random().toString(36).slice(2,12); } };
const ymd=t=>{ const d=new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const newCid=()=>'c-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isSvg=f=>f.type==='image/svg+xml'||/\.svg$/i.test(f.name);
const imgFrom=src=>new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('img')); i.src=src; });
/* SVG: a banner-studio SVG carries a finished preview + editable state; any other SVG is drawn as-is */
async function readSvg(f){
  const text=await f.text();
  let meta=null; const m=text.match(/<metadata id="banner-studio"><!\[CDATA\[([\s\S]*?)\]\]><\/metadata>/);
  if(m){ try{ meta=JSON.parse(m[1]); }catch(e){} }
  if(meta&&meta.preview){ const img=await imgFrom(meta.preview); return {img,meta}; }
  const doc=new DOMParser().parseFromString(text,'image/svg+xml'), root=doc.documentElement;
  if(!root||root.nodeName.toLowerCase()!=='svg') throw new Error('svg');
  let w=parseFloat(root.getAttribute('width')), h=parseFloat(root.getAttribute('height'));
  const vb=(root.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
  if(!(w>0&&h>0)&&vb.length===4){ w=vb[2]; h=vb[3]; } if(!(w>0&&h>0)){ w=1080; h=1080; }
  root.setAttribute('width',w); root.setAttribute('height',h);
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(root)],{type:'image/svg+xml'}));
  const img=await imgFrom(url); return {img,meta:null,plainSvg:true};
}
const readSvgText=f=>f.text();
const loadImg=async f=>isSvg(f)?readSvg(f):{img:await imgFrom(URL.createObjectURL(f))};
function render2(img,max){ const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); return c; }
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
let upItems=[], upModal=null, uploading=false;
function openUpload(files){
  const list=[...files].filter(f=>/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(f.type)||/\.svg$/i.test(f.name));
  if(!list.length){ toast('PNG·JPG·WEBP·SVG 이미지 파일만 올릴 수 있어요'); return; }
  if(!upModal){
    upItems=[];
    upModal=document.createElement('div'); upModal.className='modal';
    upModal.innerHTML=`<div class="up" role="dialog" aria-modal="true" aria-label="기존 소재 올리기">
      <div class="row"><h2>기존 소재 올리기</h2><button class="btn small" type="button" data-upx style="margin-left:auto">닫기</button></div>
      <p class="status" style="margin:0">소재명과 제작일을 확인하고 올려주세요. 성과가 좋았던 소재는 ♥를 눌러두면 바로 ‘성과 좋은 소재’에 들어가요.</p>
      <div class="row"><label for="upWho" style="font-weight:600">만든 사람</label><input type="text" id="upWho" maxlength="30" placeholder="이름"></div>
      <div class="uplist" id="upList"></div>
      <div class="drophint" id="upMore" tabindex="0" role="button">＋ 이미지 더 추가 (여기에 끌어다 놓아도 돼요)</div>
      <div class="row"><span class="status" id="upSt"></span><span class="spacer"></span><button class="btn" type="button" data-upx>취소</button><button class="btn primary" type="button" id="upGo">올리기</button></div>
    </div>`;
    document.body.appendChild(upModal);
    upModal.querySelector('#upWho').value=myName();
    upModal.addEventListener('click',e=>{ if(e.target.closest('[data-upx]')){ if(!uploading) closeUpload(); return; }
      const hb=e.target.closest('.hb'); if(hb){ const it=upItems[+hb.dataset.i]; it.fav=!it.fav; hb.setAttribute('aria-pressed',it.fav); hb.textContent=it.fav?'♥':'♡'; return; }
      const rm=e.target.closest('[data-rm]'); if(rm&&!uploading){ upItems[+rm.dataset.rm].removed=true; rm.closest('.upitem').remove(); syncUp(); } });
    const more=upModal.querySelector('#upMore'); more.onclick=()=>$('upFile').click(); more.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('upFile').click(); } };
    upModal.querySelector('#upGo').onclick=doUpload;
  }
  const box=upModal.querySelector('#upList');
  list.forEach(f=>{ const i=upItems.length, it={file:f,title:f.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim().slice(0,40),made:f.lastModified||Date.now(),fav:false};
    upItems.push(it);
    const row=document.createElement('div'); row.className='upitem'; row.dataset.i=i;
    row.innerHTML=`<img alt=""><div><input type="text" maxlength="40" aria-label="소재명" value="${esc(it.title)}"><div class="sub">${esc(f.name)} · ${(f.size/1024/1024).toFixed(1)}MB</div></div>
      <input type="date" aria-label="제작일" value="${ymd(it.made)}" max="${ymd(Date.now())}">
      <button type="button" class="hb" data-i="${i}" aria-pressed="false" title="성과 좋은 소재로 표시" aria-label="하트">♡</button>
      <span class="st"><button type="button" class="btn small" data-rm="${i}">빼기</button></span>`;
    row.querySelector('img').src=URL.createObjectURL(f);
    if(isSvg(f)) readSvg(f).then(({img,meta,plainSvg})=>{ row.querySelector('img').src=img.src; const sub=row.querySelector('.sub');
      if(meta&&meta.state){ sub.textContent+=' · 스튜디오 SVG — 문구·상품까지 다시 편집할 수 있어요'; if(meta.title&&it.title===f.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim().slice(0,40)){ it.title=meta.title; row.querySelector('input[type=text]').value=meta.title; } }
      else if(plainSvg) readSvgText(f).then(t=>{ sub.textContent+= /<text[\s>]/.test(t) ? ' · 피그마 SVG — 편집기에서 레이어별로 열리고 글자도 고칠 수 있어요' : ' · 글자가 윤곽선(도형)인 SVG — 레이어는 나뉘지만 글자는 못 고쳐요'; }); }).catch(()=>{ row.querySelector('.sub').textContent+=' · 읽을 수 없는 SVG예요'; });
    row.querySelector('input[type=text]').oninput=e=>{ it.title=e.target.value; };
    row.querySelector('input[type=date]').onchange=e=>{ const v=e.target.value; if(v){ const [y,m,d]=v.split('-').map(Number); it.made=new Date(y,m-1,d,12).getTime(); } };
    box.appendChild(row); it.row=row; });
  syncUp();
}
function syncUp(){ const n=upItems.filter(i=>!i.removed&&!i.done).length; upModal.querySelector('#upGo').textContent=n?`${n}개 올리기`:'올리기'; upModal.querySelector('#upGo').disabled=!n||uploading; }
function closeUpload(){ if(upModal){ upModal.remove(); upModal=null; upItems=[]; } }
async function doUpload(){
  const who=upModal.querySelector('#upWho').value.trim();
  if(who){ try{ localStorage.setItem('banner-studio-author',who); }catch(e){} }
  const todo=upItems.filter(i=>!i.removed&&!i.done); if(!todo.length) return;
  uploading=true; syncUp(); let ok=0, fail=0;
  for(const it of todo){
    const st=it.row.querySelector('.st'); st.className='st'; st.textContent='올리는 중…';
    try{
      const {img,meta}=await loadImg(it.file);
      const thumb=render2(img,420).toDataURL('image/jpeg',.8);
      let full=await toBlob(render2(img,2000),.9); if(full.size>MAX_FULL) full=await toBlob(render2(img,1600),.82); if(full.size>MAX_FULL) full=await toBlob(render2(img,1280),.75);
      const cid=newCid();
      const r=await fetch('/api/live?event=1',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sid:browserId()+'-up',name:who||'이름 없음',type:'upload',thumb,tid:'',tname:'직접 올린 소재',size:`${img.naturalWidth}x${img.naturalHeight}`,headline:'',title:(it.title||'').trim().slice(0,40),cid,made:it.made,
        ...(meta&&meta.state?{state:meta.state,imgs:meta.imgs||null,tid:meta.tid||'',tname:meta.tname||'직접 올린 소재'}:{})})});
      if(!r.ok) throw new Error(r.status); const j=await r.json();
      const r2=await fetch('/api/live/'+encodeURIComponent(j.id)+'/full',{method:'PUT',headers:{'content-type':'image/jpeg'},body:full}); if(!r2.ok) throw new Error(r2.status);
      if(isSvg(it.file)&&!(meta&&meta.state)&&it.file.size<=20*1024*1024) await fetch('/api/live/'+encodeURIComponent(j.id)+'/svg',{method:'PUT',headers:{'content-type':'image/svg+xml'},body:it.file}).catch(()=>{});
      if(it.fav) await fetch('/api/live?fav=1',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:cid,fav:true,name:who})});
      it.done=true; ok++; st.className='st ok'; st.textContent='완료';
    }catch(e){ fail++; st.className='st err'; st.textContent='실패'; }
    upModal.querySelector('#upSt').textContent=`${ok+fail} / ${todo.length}`;
  }
  uploading=false; syncUp(); await load(true);
  if(!fail){ toast(`소재 ${ok}개를 올렸어요`); closeUpload(); }
  else upModal.querySelector('#upSt').textContent=`${ok}개 올림 · ${fail}개 실패 — ‘${fail}개 올리기’로 다시 시도할 수 있어요`;
}
$('upBtn').onclick=()=>$('upFile').click();
$('upFile').onchange=e=>{ if(e.target.files.length) openUpload(e.target.files); e.target.value=''; };
let dragN=0;
document.addEventListener('dragenter',e=>{ if([...(e.dataTransfer?.types||[])].includes('Files')){ dragN++; document.body.classList.add('dragging'); } });
document.addEventListener('dragleave',()=>{ dragN=Math.max(0,dragN-1); if(!dragN) document.body.classList.remove('dragging'); });
document.addEventListener('dragover',e=>{ if([...(e.dataTransfer?.types||[])].includes('Files')) e.preventDefault(); });
document.addEventListener('drop',e=>{ if(!e.dataTransfer||!e.dataTransfer.files.length) return; e.preventDefault(); dragN=0; document.body.classList.remove('dragging'); if(!uploading) openUpload(e.dataTransfer.files); });

$('list').innerHTML='<div class="empty">불러오는 중…</div>';
load();
setInterval(()=>{ if(document.visibilityState==='visible' && !modal) load(true); },120000);
})();
</script>
